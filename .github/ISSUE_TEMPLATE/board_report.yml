name: It works (or not) on my board
description: Report results on a different board revision, screen or battery
labels: [hardware]
body:
  - type: input
    id: board
    attributes:
      label: Board and revision
    validations: {required: true}
  - type: textarea
    id: result
    attributes:
      label: What worked and what did not
      description: Display, touch, Wi-Fi, speaker, battery, power key.
    validations: {required: true}
