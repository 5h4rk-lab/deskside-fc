name: Idea or feature request
description: Suggest something new
labels: [enhancement]
body:
  - type: textarea
    id: moment
    attributes:
      label: What moment made you wish for this?
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
  - type: textarea
    id: cost
    attributes:
      label: Anything it must not break?
      description: For example memory (internal RAM is tight), smooth swipes, quiet sound.
