; Soccer display firmware for the Waveshare ESP32-S3-Touch-LCD-2.8 (V2).
;
; Build:    pio run -e app
; Flash:    pio run -e app -t upload
; Monitor:  pio device monitor -b 115200
;
; Environments: app (release, -O2, live data from the helper), app_diag (release plus
; the measurement hooks), app_debug (-Og with debug symbols and the measurement hooks)
; and app_demo (release with the built-in demo data and a fixed demo clock, no helper:
; offline tests and screenshots).
; The UI library in ../../ui is shared with the simulator: one copy of the
; sources, linked here through lib_deps (see ui/library.json).
;
; The helper's URL and token are normally provisioned into NVS over the serial
; console (tools/provision-helper.sh), so no image carries the token. Optional
; build defaults can live in secrets.ini (git-ignored, see secrets.ini.example).
; The build works without it.

[platformio]
default_envs = app
extra_configs = secrets.ini

; Defaults for the optional secrets file. secrets.ini overrides this section.
[secrets]
helper_flags =

[env]
; Board id added in platform-espressif32 v8.0.0 (Arduino-ESP32 3.3.x).
platform = espressif32@8.0.0
board = waveshare_esp32_s3_touch_lcd_28
framework = arduino
board_build.partitions = partitions.csv
; The Arduino build flashes the app at 0x10000 unless told otherwise; with the
; 64 KB nvs partition at 0x10000 the first app slot (app0) starts at 0x20000.
board_upload.offset_address = 0x20000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags =
    -Os
; The platform defaults to gnu++2b/2a; the UI is written for C++17.
; tools/cxx17.py puts -std=gnu++17 last on every C++ command line.
extra_scripts =
    pre:tools/gen_demo_fixtures.py
    post:tools/cxx17.py
; The board JSON already sets 16 MB QIO flash, OPI PSRAM (qio_opi) and
; -DARDUINO_USB_MODE=1; CDC_ON_BOOT routes Serial to the native USB-C port.
; -I$PROJECT_INCLUDE_DIR lets LVGL (built as a library) find include/lv_conf.h;
; The last -I reaches LVGL's private tjpgd headers (ui/src/lvgl_image_decoder.cpp
; calls tjpgd directly: LVGL 9.2's JPEG decoder cannot read from memory).
; LV_KCONFIG_IGNORE stops it pulling in ESP-IDF Kconfig headers (the .S files
; of its optional asm back ends are assembled without the IDF include paths).
build_flags =
    -fno-exceptions
    -O2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_KCONFIG_IGNORE
    -I$PROJECT_INCLUDE_DIR
    -I$PROJECT_LIBDEPS_DIR/$PIOENV/lvgl/src/libs/tjpgd
    ${secrets.helper_flags}
; Warnings for this project's own sources (src/). The ui library turns on the
; same warnings for itself in ui/library.json; LVGL and the Arduino core keep
; their own settings.
build_src_flags =
    -Wall
    -Wextra
lib_deps =
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@7.4.2
    symlink://../../ui

[env:app]

; Release build plus the measurement hooks (scripted touch, frame-time trace,
; full-repaint and part-hiding serial commands; see main.cpp). Never flash this
; one for the gift: any serial byte can inject a touch.
[env:app_diag]
build_flags =
    ${env.build_flags}
    -DAPP_DIAG=1

[env:app_debug]
build_type = debug
build_unflags =
    ${env.build_unflags}
    -O2
build_flags =
    ${env.build_flags}
    -Og
    -DAPP_DEBUG=1
    -DAPP_DIAG=1

; The demo-data app: demo matches from the shared MockSource and a fixed demo
; clock (2026-10-20 20:00 UTC); Wi-Fi works, no helper requests, no SNTP.
[env:app_demo]
build_flags =
    ${env.build_flags}
    -DAPP_DEMO_DATA=1
