; Bring-up test firmware for the Waveshare ESP32-S3-Touch-LCD-2.8 (V1 or V2).
;
; Four environments, same code, different display options:
;   bringup             vendor-faithful (little-endian RGB565 + INVON), try this first
;   bringup_swap        byte-swapped RGB565 in the fill routines
;   bringup_noinv       no INVON (display inversion off)
;   bringup_swap_noinv  both of the above
;
; Build and flash:   pio run -e bringup -t upload
; Serial monitor:    pio device monitor -b 115200
;
; Optional Wi-Fi credentials live in secrets.ini (git-ignored, see
; secrets.ini.example). The build works without it: the firmware then only
; scans for networks.

[platformio]
default_envs = bringup
extra_configs = secrets.ini

; Defaults for the optional secrets file. secrets.ini overrides this section.
[secrets]
wifi_flags =

[env]
; Board id added in platform-espressif32 v8.0.0 (Arduino-ESP32 3.3.x).
platform = espressif32@^8.0.0
board = waveshare_esp32_s3_touch_lcd_28
framework = arduino
monitor_speed = 115200
; Decodes crash backtraces into file:line in the monitor.
monitor_filters = esp32_exception_decoder
; The board JSON already sets 16 MB QIO flash, OPI PSRAM (qio_opi),
; -DARDUINO_USB_MODE=1 and -DBOARD_HAS_PSRAM. CDC_ON_BOOT routes Serial to
; the native USB-C port. BOARD_HAS_PSRAM is repeated so the intent is visible.
; Display SPI clock: 40 MHz default (set in display_st7789.cpp); the vendor
; demo uses 80 MHz. To try 80 MHz without editing any file:
;   PLATFORMIO_BUILD_FLAGS="-DBRINGUP_SPI_HZ=80000000" pio run -e bringup -t upload
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ${secrets.wifi_flags}
; Warnings for this project's own sources only (not the Arduino core).
build_src_flags =
    -Wall
    -Wextra

[env:bringup]
build_flags =
    ${env.build_flags}
    -DBRINGUP_ENV_NAME=\"bringup\"

[env:bringup_swap]
build_flags =
    ${env.build_flags}
    -DBRINGUP_ENV_NAME=\"bringup_swap\"
    -DBRINGUP_SWAP_BYTES=1

[env:bringup_noinv]
build_flags =
    ${env.build_flags}
    -DBRINGUP_ENV_NAME=\"bringup_noinv\"
    -DBRINGUP_NO_INVERT=1

[env:bringup_swap_noinv]
build_flags =
    ${env.build_flags}
    -DBRINGUP_ENV_NAME=\"bringup_swap_noinv\"
    -DBRINGUP_SWAP_BYTES=1
    -DBRINGUP_NO_INVERT=1
